[package]
name        = "risepir-client"
version     = "0.1.0"
edition.workspace = true
license.workspace   = true
publish     = false
description = "Response-rewind RisePIR client: pins (A, H0, block0) and corrects a response answered at the server's head against a rolling public delta, so the client never needs to catch up to the server (docs/plan.md §3.3, ADR-0003). Library only, no JSON-RPC yet."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
risepir-proto  = { path = "../risepir-proto" }
risepir-server = { path = "../risepir-server" }

ikpir-common = { workspace = true }
segmented-cuckoo = { workspace = true }
