[package]
name        = "risepir-http"
version     = "0.1.0"
edition.workspace = true
license.workspace   = true
publish     = false
description = "SimplePIR-concrete binary wire codec + axum HTTP server exposing the RisePIR endpoints (answer/sync/setup/head/delta) over risepir-server (docs/plan.md §3.4, ADR-0006, ADR-0010)."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Sibling crates in this workspace.
risepir-proto  = { path = "../risepir-proto" }
risepir-server = { path = "../risepir-server" }

ikpir-common = { workspace = true }
segmented-cuckoo = { workspace = true }

axum  = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }

# Production hardening on the listener (threat model §3): a per-request
# timeout (tower-http, returns a clean 408 instead of surfacing an error
# type) and a concurrency cap on the huge-response `/setup` route (tower's
# semaphore-based limit). Both are already in the dependency graph via
# axum; the explicit entries only switch on the named features.
tower      = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }

# Stage 0.4: the async counterpart to this crate's own axum server —
# `client` drives the RisePIR HTTP transport from the JSON-RPC front end
# (`risepir-rpc`) over real HTTP. `default-features = false` +
# `rustls-tls` avoids pulling in a native TLS toolchain for what is,
# today, a plain-HTTP localhost deployment.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# Dev-only: the integration test in `tests/http.rs` drives a MockFeed
# genesis through a real client end to end. Never a runtime dependency of
# this crate itself.
risepir-feed   = { path = "../risepir-feed" }
risepir-client = { path = "../risepir-client" }

# `ServiceExt::oneshot` — in-process request driving with no real network.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
