[package]
name        = "risepir-client"
version     = "0.1.0"
edition.workspace = true
license.workspace   = true
rust-version.workspace = true
publish     = false
description = "Response-rewind RisePIR client: pins (A, H0, block0) and corrects a response answered at the server's head against a rolling public delta, so the client never needs to catch up to the server (docs/plan.md §3.3, ADR-0003). Library only, no JSON-RPC yet."

[lints.rust]
unsafe_code = "forbid"

# See `risepir-proto`'s own `[features]`: default-on, forwarded, and turned
# off only by the browser client (ADR-0019) — this crate is the one that
# actually runs there.
[features]
default  = ["parallel"]
parallel = ["ikpir-common/parallel", "risepir-proto/parallel", "risepir-server/parallel"]

[dependencies]
risepir-proto  = { path = "../risepir-proto", default-features = false }
risepir-server = { path = "../risepir-server", default-features = false }

ikpir-common = { workspace = true, default-features = false }
segmented-cuckoo = { workspace = true }
