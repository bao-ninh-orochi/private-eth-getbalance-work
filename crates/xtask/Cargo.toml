[package]
name        = "xtask"
version     = "0.1.0"
edition.workspace = true
license.workspace   = true
rust-version.workspace = true
publish     = false
description = "Repo-local developer tooling. Today: the Stage 0.5 conformance harness — one command proving the private client's answers are byte-identical to in-process ground truth across >=1000 sampled addresses x >=100 consecutive blocks, spanning every account category, diffed continuously (docs/plan.md §6, §8)."

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

# Default-on rayon kernels — see the workspace manifest's `ikpir-common`
# note (ADR-0019). Load-bearing here: `xtask bench` writes docs/numbers.md,
# and the numbers there are the parallel-kernel ones.
[features]
default  = ["parallel"]
parallel = [
    "ikpir-common/parallel",
    "risepir-proto/parallel",
    "risepir-server/parallel",
    "risepir-client/parallel",
]

[dependencies]
# Sibling crates in this workspace — the full in-process pipeline
# (mock feed -> server -> delta ring -> client) the harness drives
# directly, with no HTTP layer (docs/plan.md §6 Stage 0.5).
risepir-proto  = { path = "../risepir-proto" }
risepir-server = { path = "../risepir-server" }
risepir-client = { path = "../risepir-client" }
risepir-feed   = { path = "../risepir-feed" }

ikpir-common = { workspace = true }
segmented-cuckoo = { workspace = true }

# `xtask report`'s JSON inputs (`--setup`, `--setup-download`, and a JSON
# `--provenance`) — not a new dependency in substance: `risepir-feed` and
# `risepir-rpc` already pin `serde_json = "1"`, so this resolves to the
# version already in `Cargo.lock` rather than adding a new one. The CSV
# inputs stay hand-rolled (`report.rs`'s own parser) — no `csv` crate.
serde_json = "1"
