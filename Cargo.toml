[workspace]
resolver = "2"
members  = ["crates/*"]

[workspace.package]
edition = "2021"

# The IKPIR primitive, pinned at the `perf/optimized` tip (042d868) — the
# build docs/numbers.md §7's headline was measured against. One place, not
# seven: every crate says `{ workspace = true }`. The former path deps
# pointed at ../../../CANS2026/Incremental-Keyword-PIR, a checkout that has
# since been renamed, which is exactly the fragility a pinned rev removes.
[workspace.dependencies]
ikpir-common     = { git = "https://github.com/bao-ninh-orochi/IKPIR", rev = "042d868" }
segmented-cuckoo = { git = "https://github.com/bao-ninh-orochi/IKPIR", rev = "042d868" }
ikpir-server     = { git = "https://github.com/bao-ninh-orochi/IKPIR", rev = "042d868" }
