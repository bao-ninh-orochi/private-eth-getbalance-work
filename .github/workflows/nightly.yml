# Nightly gates (ADR-0021): everything that needs the network or long
# wall-clock, and must therefore never gate a merge.
#
#   live feed gate — validates diffMode trace parsing byte-exactly against an
#                    independent provider on a real finalized block. Depends
#                    on two third-party keyless RPCs being up; a red night is
#                    a signal to investigate, not an emergency.
#   fuzz smoke     — coverage-guided fuzzing of every attacker-facing decoder
#                    (fuzz/), a few minutes per target. Long exploratory runs
#                    stay local; this catches regressions.

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

  # Same reason as `ci.yml`'s, which carries the full explanation: these
  # jobs share `Swatinem/rust-cache` artifacts across a heterogeneous
  # `ubuntu-latest` pool, and `.cargo/config.toml`'s `target-cpu=native`
  # makes those artifacts runner-specific — SIGILL on the next runner that
  # lacks an instruction the last one had.
  #
  # Scope caveat for the fuzz job: this pin does NOT reach the fuzz-target
  # builds themselves. `cargo fuzz` exports its own `RUSTFLAGS`
  # (sanitizer/coverage flags), and cargo's rustflags sources are mutually
  # exclusive — a set `RUSTFLAGS` wins over both this env var and the
  # config file — so fuzz targets build at the generic baseline either
  # way and never saw `native` to begin with. What the pin covers in that
  # job is the `cargo install cargo-fuzz` build (host tools, built under
  # this cwd's config), plus every non-fuzz job here in full.
  CARGO_BUILD_RUSTFLAGS: -C target-cpu=x86-64-v3

jobs:
  live-feed-gate:
    name: live feed gate (real mainnet, independent provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test -p risepir-feed --release -- --ignored

  fuzz-smoke:
    name: fuzz smoke (attacker-facing decoders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            fuzz
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Run each fuzz target briefly
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "── fuzzing $target ──"
            cargo +nightly fuzz run "$target" -- -max_total_time=120
          done
