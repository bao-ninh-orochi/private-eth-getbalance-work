# cargo-deny configuration (ADR-0021, roadmap A4).
# Run locally: `cargo deny check` — CI runs it on every push/PR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything this workspace links must be under one of these. Additions get
# reviewed here, in a commit that says why.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",  # tiny-keccak
    "BSL-1.0",  # xxhash-rust
]

[bans]
# Duplicate versions are inevitable in an async/HTTP dependency tree; keep
# them visible without failing the build.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `{ path = ... }` deps carry no version by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The one non-crates.io source this workspace is allowed to build from: the
# pinned IKPIR primitive (rev-pinned in the root manifest).
allow-git = ["https://github.com/bao-ninh-orochi/IKPIR"]
